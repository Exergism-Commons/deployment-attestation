name: Fix Codex hardening patch v4

on:
  push:
    branches: [initial-attestation-architecture]
    paths:
      - '.github/workflows/fix-codex-patch-v4.yml'

permissions:
  contents: write

jobs:
  patch-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: initial-attestation-architecture
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/workflows/apply-codex-p2-fixes-v4.yml')
          s=p.read_text()
          pat=r'''(?ms)^          # Persist the normal submodule worktree \.git gitfile itself, not only\n.*?^          literal\(old_gitlink, new_gitlink\)\n'''
          repl='''          # Persist the normal submodule worktree .git gitfile itself, not only
          # the resolved git-dir/common-dir that it points to. Match by semantic
          # content rather than indentation because this Python lives in YAML.
          gitlink_pat = r'(?ms)^[ \\t]+if mode == "160000" and kind == "commit":\\n[ \\t]+pst = p\\.lstat\\(\\)\\n[ \\t]+if not stat\\.S_ISDIR\\(pst\\.st_mode\\):\\n[ \\t]+raise RuntimeError\\(f"gitlink is not a real directory during fsync: \\{rel\\}"\\)\\n[ \\t]+add_parent_chain\\(dirs, p, repo\\)\\n[ \\t]+submods\\.append\\(\\(p, oid\\)\\)\\n[ \\t]+continue'
          gitlink_body = textwrap.dedent(r'''
          if mode == "160000" and kind == "commit":
              pst = p.lstat()
              if not stat.S_ISDIR(pst.st_mode):
                  raise RuntimeError(f"gitlink is not a real directory during fsync: {rel}")
              add_parent_chain(dirs, p, repo)
              gitfile = p / ".git"
              try:
                  gst = gitfile.lstat()
              except FileNotFoundError as exc:
                  raise RuntimeError(f"submodule gitfile missing during fsync: {rel}") from exc
              if stat.S_ISREG(gst.st_mode):
                  fsync_regular(gitfile)
                  add_parent_chain(dirs, gitfile, repo)
              elif stat.S_ISDIR(gst.st_mode):
                  fsync_dir(gitfile)
                  add_parent_chain(dirs, gitfile, repo)
              else:
                  raise RuntimeError(f"unsafe submodule .git entry during fsync: {rel}")
              submods.append((p, oid))
              continue
          ''').strip('\\n')
          gitlink_repl = textwrap.indent(gitlink_body, '        ')
          s2, n = re.subn(gitlink_pat, lambda _: gitlink_repl, s, count=1)
          if n != 1:
              raise SystemExit(f'gitlink replacement count={n}')
          s = s2
'''
          out,n=re.subn(pat,repl,s,count=1)
          if n != 1: raise SystemExit(f'v4 workflow block replacement count={n}')
          p.write_text(out)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-codex-p2-fixes-v4.yml
          git commit -m 'ci: make hardening patch whitespace-independent'
          git push origin HEAD:initial-attestation-architecture
