name: Run latest Codex fix

on:
  push:
    branches: [initial-attestation-architecture]
    paths:
      - 'tools/apply_latest_codex_fixes.py'
      - '.github/workflows/run-latest-codex-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: initial-attestation-architecture
          fetch-depth: 0
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_latest_codex_fixes.py
          bash -n agent/ec-deployment-agent.sh
          bash -n install/install-id-exergism.sh
          python3 -m json.tool spec/attestation-v0.1.schema.json >/dev/null
          git diff --check
          grep -Fq 'AGENT_VERSION="0.1.0-pre9"' agent/ec-deployment-agent.sh
          grep -Fq 'finalize_quiescent' agent/ec-deployment-agent.sh
          grep -Fq 'submodule gitfile missing during fsync' agent/ec-deployment-agent.sh
          grep -Fq 'runtime_present' agent/ec-deployment-agent.sh
          grep -Fq 'setsid "$EC_SMOKE_SCRIPT"' agent/ec-deployment-agent.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/ec-deployment-agent.sh spec/attestation-v0.1.schema.json install/install-id-exergism.sh
          git commit -m 'fix: close quiescence and missing-runtime gaps'
          git push origin HEAD:initial-attestation-architecture
