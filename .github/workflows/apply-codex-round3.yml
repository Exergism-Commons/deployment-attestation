name: Apply Codex round 3

on:
  push:
    branches: [initial-attestation-architecture]
    paths:
      - 'tools/apply_codex_round3.py'
      - '.github/workflows/apply-codex-round3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: initial-attestation-architecture
          fetch-depth: 0
      - name: Apply and validate round-3 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_codex_round3.py
          bash -n agent/ec-deployment-agent.sh
          bash -n install/install-id-exergism.sh
          git diff --check
          grep -Fq 'AGENT_VERSION="0.1.0-pre11"' agent/ec-deployment-agent.sh
          grep -Fq 'artifact_write_fence()' agent/ec-deployment-agent.sh
          grep -Fq 'nsenter --target "$pid" --mount -- findmnt -T "$path"' agent/ec-deployment-agent.sh
          grep -Fq 'artifact_fence' agent/ec-deployment-agent.sh
          grep -Fq 'ReadOnlyPaths=/srv/id.exergism.org' packaging/id-exergism-artifact-fence.conf
          grep -Fq 'ReadOnlyPaths=/usr/local/bin/idresolver' packaging/id-exergism-artifact-fence.conf

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/ec-deployment-agent.sh install/install-id-exergism.sh packaging/id-exergism-artifact-fence.conf .github/workflows/ci.yml docs/THREAT-MODEL.md
          git commit -m 'fix: fence deployment artifacts from service writes'
          git push origin HEAD:initial-attestation-architecture
