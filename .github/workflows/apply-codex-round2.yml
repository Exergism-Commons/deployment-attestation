name: Apply Codex round 2

on:
  push:
    branches: [initial-attestation-architecture]
    paths:
      - 'tools/apply_codex_round2.py'
      - '.github/workflows/apply-codex-round2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: initial-attestation-architecture
          fetch-depth: 0
      - name: Apply and validate agent patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_codex_round2.py
          bash -n agent/ec-deployment-agent.sh
          git diff --check
          grep -Fq 'AGENT_VERSION="0.1.0-pre10"' agent/ec-deployment-agent.sh
          grep -Fq 'ExitType=cgroup' agent/ec-deployment-agent.sh
          grep -Fq 'phase":"activating' agent/ec-deployment-agent.sh
          grep -Fq 'mark_transaction_committed' agent/ec-deployment-agent.sh
          grep -Fq 'snapshot="$(collect_checks' agent/ec-deployment-agent.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/ec-deployment-agent.sh
          git commit -m 'fix: preserve recovery through final service verification'
          git push origin HEAD:initial-attestation-architecture
