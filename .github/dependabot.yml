# Dependabot version updates for Exergism-Commons/deployment-attestation.
# Documentation:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # .NET test dependencies such as Microsoft.NET.Test.Sdk and MSTest.
  - package-ecosystem: "nuget"
    directory: "/tests/Exergism.DeploymentAttestation.Agent.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions used by CI, Native AOT and release workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
